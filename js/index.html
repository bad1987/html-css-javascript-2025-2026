<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>User Authentication System</h1>
            <nav class="nav">
                <button id="nav-register" class="nav-btn active">Register</button>
                <button id="nav-login" class="nav-btn">Login</button>
                <button id="nav-profile" class="nav-btn hidden">Profile</button>
            </nav>
        </header>

        <main>
            <!-- Status Messages -->
            <div id="status-message" class="status-message hidden"></div>

            <!-- Registration Section -->
            <section id="register-section" class="form-section active">
                <div class="form-container">
                    <h2>Create Account</h2>
                    <form id="register-form" class="auth-form">
                        <div class="form-group">
                            <label for="reg-username">Username</label>
                            <input type="text" id="reg-username" name="username" required minlength="3" maxlength="20">
                        </div>

                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" name="password" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="reg-confirm-password">Confirm Password</label>
                            <input type="password" id="reg-confirm-password" name="confirmPassword" required minlength="6">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <span class="btn-text">Create Account</span>
                            <div class="spinner hidden"></div>
                        </button>
                    </form>

                    <div class="form-footer">
                        <p>Already have an account? <button id="switch-to-login" class="link-btn">Login here</button></p>
                    </div>
                </div>
            </section>

            <!-- Login Section -->
            <section id="login-section" class="form-section">
                <div class="form-container">
                    <h2>Welcome Back</h2>
                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <label for="login-username">Username or Email</label>
                            <input type="text" id="login-username" name="usernameOrEmail" required>
                        </div>

                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <span class="btn-text">Login</span>
                            <div class="spinner hidden"></div>
                        </button>
                    </form>

                    <div class="form-footer">
                        <p><button id="switch-to-reset" class="link-btn">Forgot Password?</button></p>
                        <p>Don't have an account? <button id="switch-to-register" class="link-btn">Register here</button></p>
                    </div>
                </div>
            </section>

            <!-- Password Reset Section -->
            <section id="reset-section" class="form-section">
                <div class="form-container">
                    <h2>Reset Password</h2>
                    <form id="reset-form" class="auth-form">
                        <div class="form-group">
                            <label for="reset-email">Email Address</label>
                            <input type="email" id="reset-email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="reset-new-password">New Password</label>
                            <input type="password" id="reset-new-password" name="newPassword" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="reset-confirm-password">Confirm New Password</label>
                            <input type="password" id="reset-confirm-password" name="confirmPassword" required minlength="6">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <span class="btn-text">Reset Password</span>
                            <div class="spinner hidden"></div>
                        </button>
                    </form>

                    <div class="form-footer">
                        <p>Remember your password? <button id="switch-to-login-from-reset" class="link-btn">Login here</button></p>
                    </div>
                </div>
            </section>

            <!-- Profile Section -->
            <section id="profile-section" class="form-section">
                <div class="form-container">
                    <h2>Edit Profile</h2>
                    <form id="profile-form" class="auth-form">
                        <div class="form-group">
                            <label for="profile-username">Username</label>
                            <input type="text" id="profile-username" name="username" required minlength="3" maxlength="20">
                        </div>

                        <div class="form-group">
                            <label for="profile-email">Email</label>
                            <input type="email" id="profile-email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="profile-current-password">Current Password</label>
                            <input type="password" id="profile-current-password" name="currentPassword" required>
                        </div>

                        <div class="form-group">
                            <label for="profile-new-password">New Password (optional)</label>
                            <input type="password" id="profile-new-password" name="newPassword" minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="profile-confirm-password">Confirm New Password</label>
                            <input type="password" id="profile-confirm-password" name="confirmPassword">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <span class="btn-text">Update Profile</span>
                                <div class="spinner hidden"></div>
                            </button>
                            <button type="button" id="cancel-profile-edit" class="btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Dashboard Section -->
            <section id="dashboard-section" class="form-section">
                <div class="dashboard-container">
                    <h2>Welcome, <span id="user-display-name"></span>!</h2>
                    <div class="dashboard-content">
                        <p>You are successfully logged in.</p>
                        <div class="dashboard-actions">
                            <button id="edit-profile-btn" class="btn btn-secondary">Edit Profile</button>
                            <button id="logout-btn" class="btn btn-danger">Logout</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- <script src="full-script.js"></script> -->
    <script src="script-fr.js"></script>
</body>
</html>
