site_name: HTML, CSS and JavaScript Course 2025-2026
site_url: https://bad1987.github.io/html-css-javascript-2025-2026
site_description: A complete HTML, CSS and JavaScript course for beginners (2025-2026).
site_author: Course Author

# Theme configuration
theme:
  name: material
  custom_dir: docs/.overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - content.code.annotate

# Repository configuration
repo_name: html-css-javascript-2025-2026
repo_url: https://github.com/bad1987/html-css-javascript-2025-2026

# Plugins
plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - print-site:
      add_to_navigation: true
      print_page_title: 'Print the entire course'

# Navigation menu - include all modules that exist
nav:
  - Home: index.md
  - Module 01 - Introduction to Web Development:
    - Introduction: module-01-introduction/README.md
    - Practical Project: module-01-introduction/cas-pratique.md
    - Homework Exercises: module-01-introduction/exercices-maison.md
  - Module 02 - HTML Structure and Semantics:
    - Introduction: module-02-html-structure/README.md
    - Practical Project: module-02-html-structure/cas-pratique.md
    - Homework Exercises: module-02-html-structure/exercices-maison.md
  - Module 03 - CSS Fundamentals:
    - Introduction: module-03-css-fundamentals/README.md
    - Practical Project: module-03-css-fundamentals/cas-pratique.md
    - Homework Exercises: module-03-css-fundamentals/exercices-maison.md
  - Module 04 - CSS Layout and Responsive Design:
    - Introduction: module-04-css-layout/README.md
    - Practical Project: module-04-css-layout/cas-pratique.md
    - Homework Exercises: module-04-css-layout/exercices-maison.md
  - Module 05 - JavaScript Basics:
    - Introduction: module-05-javascript-basics/README.md
    - Practical Project: module-05-javascript-basics/cas-pratique.md
    - Homework Exercises: module-05-javascript-basics/exercices-maison.md
  - Module 06 - JavaScript Functions and Objects:
    - Introduction: module-06-javascript-functions-objects/README.md
    - Practical Project: module-06-javascript-functions-objects/cas-pratique.md
    - Homework Exercises: module-06-javascript-functions-objects/exercices-maison.md
  - Module 07 - Advanced JavaScript and APIs:
    - Introduction: module-07-advanced-javascript-apis/README.md
    - Practical Project: module-07-advanced-javascript-apis/cas-pratique.md
    - Homework Exercises: module-07-advanced-javascript-apis/exercices-maison.md
  - Module 08 - Full-Stack Web Applications:
    - Introduction: module-08-fullstack-web-applications/README.md
    - Practical Project: module-08-fullstack-web-applications/cas-pratique.md
    - Homework Exercises: module-08-fullstack-web-applications/exercices-maison.md
  - Module 09 - Advanced Topics and Best Practices:
    - Introduction: module-09-advanced-topics-best-practices/README.md
    - Practical Project: module-09-advanced-topics-best-practices/cas-pratique.md
    - Homework Exercises: module-09-advanced-topics-best-practices/exercices-maison.md

# Extra CSS & JavaScript
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde